table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px}

.credlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px 26px}.crow{display:grid;grid-template-columns:74px 1fr;gap:14px;align-items:start}.cart{width:74px;aspect-ratio:2/3;background:var(--black);overflow:hidden;box-shadow:0 1px 5px rgba(20,18,14,.22)}.cart img{width:100%;height:100%;object-fit:cover;display:block}.cart .noart{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:15px;color:#5a5a62;letter-spacing:.05em}.cmeta b{display:block;font-size:15px;line-height:1.25;color:var(--ink)}.cmeta .cn{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin-top:3px}.cmeta .cbits{font-family:var(--mono);font-size:11px;color:var(--grey);margin-top:5px;line-height:1.6}.cbrk{margin:9px 0 0;font-size:13.5px;line-height:1.5;color:var(--ink);border-left:2px solid var(--salmon);padding-left:11px}
.arts img{width:78px;aspect-ratio:2/3;object-fit:cover;background:var(--black);box-shadow:0 1px 5px rgba(20,18,14,.2)}

.doc{width:100%;height:min(560px,96vw);border:0;background:#fff;box-shadow:0 0 0 1px var(--hair);display:block}object.doc{height:auto;min-height:0}object.doc:not(:has(*)){height:min(560px,96vw)}.nodoc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;background:#fff;color:var(--grey);font-family:var(--mono);font-size:12px;text-align:center;padding:34px 24px}.nodoc p{margin:0}.btn{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);border:1px solid var(--blue);padding:9px 16px;text-decoration:none;background:transparent}.btn:hover{background:var(--blue);color:var(--bond)}.docbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}.dochint{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--grey)}.btn:focus-visible,video:focus-visible{outline:2px solid var(--salmon);outline-offset:3px}

}

/* ---- slate: name left, the facts right ---- */
.slate{grid-template-columns:1fr auto;align-items:start}
.facts{font-family:var(--mono);font-size:12px;line-height:1.9;text-align:right;white-space:nowrap}
.facts .k{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--grey);display:block;margin-top:14px}
.facts .k:first-child{margin-top:0}
.facts a{color:var(--blue);text-decoration:none;border-bottom:1px solid var(--hair)}
.facts a:hover{border-bottom-color:var(--blue)}
.who{display:block}.who .name{margin-bottom:2px}.who .hs{max-width:214px;margin-top:22px}@media(max-width:720px){.who{grid-template-columns:1fr}.who .hs{max-width:280px}}

/* ---- the wall of work ---- */
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:30px 20px;align-items:start}
.pcard{display:block;background:none;border:0;padding:0;text-align:left;cursor:pointer;font:inherit;color:inherit;
 /* a grid item stretches to the tallest card in its row, and a button centres what
    it holds - together those push a shorter card's poster down out of line */
 align-self:start}
.part{position:relative;aspect-ratio:2/3;overflow:hidden;background:var(--black);
 box-shadow:0 1px 0 var(--hair),0 8px 18px rgba(20,18,14,.14);transition:transform .18s,box-shadow .18s}
.part img{width:100%;height:100%;object-fit:cover;display:block}
.pcard:hover .part{transform:translateY(-3px);box-shadow:0 1px 0 var(--hair),0 14px 26px rgba(20,18,14,.22)}
.playdot{position:absolute;right:9px;bottom:9px;width:28px;height:28px;border-radius:50%;
 background:rgba(12,12,14,.72);color:#fff;font-size:10px;display:flex;align-items:center;
 justify-content:center;opacity:0;transition:opacity .18s}
.pcard:hover .playdot{opacity:1}
.pmeta{padding-top:10px}
.pmeta b{display:block;font-family:var(--disp);font-size:14.5px;line-height:1.28;letter-spacing:-.01em;
 /* a title that runs to two lines would otherwise shove the character name and the
    credit line down out of step with the rest of the row - so every title keeps two */
 min-height:2.56em}
.pch{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;color:var(--blue);margin-top:3px;
 /* one line, always - an empty slot has to measure the same as a filled one, and a
    long role name has to stay on one line or it shifts everything under it. The full

 line-height:1.6;min-height:1.6em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbits{display:block;font-family:var(--mono);font-size:10.5px;color:var(--grey);margin-top:2px}

/* ---- the viewer ---- */
.viewer{position:fixed;inset:0;background:rgba(12,12,14,.94);z-index:900;display:none;
 align-items:center;justify-content:center;padding:24px}

/* ---- short films ---- */
.films{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1px;
 background:var(--hair);border:1px solid var(--hair)}
.film{display:block;background:var(--bond);padding:20px 22px;text-decoration:none;color:inherit}

/* Key art on a film card. Posters arrive at whatever shape they were made in - 4:3,
   16:9 - so the card fixes the frame and the image fills it. */
.film{padding:0;overflow:hidden}
.fart{display:block;aspect-ratio:16/9;overflow:hidden;background:var(--black)}

.fart img{width:100%;height:100%;object-fit:contain;display:block}

.photo{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:var(--black)}

@media(max-width:720px){
 .slate{grid-template-columns:1fr;gap:20px}
 .facts{text-align:left}
 .hero{grid-template-columns:1fr}
}

/* The mark sits with the name, not down beside the headshot - it reads as his rather
   than as decoration floating in the gap. */
.namerow{display:flex;align-items:center;gap:clamp(12px,2.4vw,26px)}
.namerow .name{margin:0}
/* Headshot and stills are one grid of equal cells, all cut to the same shape. The
   first attempt stretched the stills to the headshot's height, which is circular -
   the row's height came from the images and the images' height came from the row,
   so they fell back to their natural size and blew the page open. Equal columns and
   a fixed ratio means nothing has to measure anything. */
/* One column per picture, however many there are - a fixed count meant the fifth
   wrapped onto a second row the moment a still was added. */
.hsrow{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;
 gap:clamp(7px,1.1vw,12px);margin-top:22px}

}

/* ---- the mark ----
   It sat in its own grid column first, which looked right and was not: a third track
   narrowed the first one and broke his name onto two lines. The dead space was never
   between the columns anyway - it is beside the headshot. So the mark goes there, in
   the same column as everything else about him, and the name gets its width back. */
.sigil{width:clamp(52px,5.6vw,84px);height:auto;display:block;flex:0 0 auto;opacity:.95}
@media(max-width:620px){ .sigil{width:46px} }

/* His name goes on one line. It was overflowing its column by about fifteen pixels,
   which is the worst possible margin - it looks like a decision rather than an
   accident. Sized to the space and told not to break.

   nowrap has a cost: the name then sets a floor under the column width, and on a
   narrow screen that floor pushed the whole page wider than the phone. So a grid
   child is allowed to shrink, and the name is sized against the viewport all the way
   down rather than hitting a fixed minimum and overflowing. */
.slate>*{min-width:0}
.who .name{white-space:nowrap;font-size:clamp(19px,5.4vw,57px);line-height:1.02}
@media(max-width:900px){ .who .name{font-size:clamp(19px,4.6vw,40px)} }
@media(max-width:620px){ .who .name{font-size:clamp(19px,6.6vw,34px)} }
@media(max-width:430px){ .who .name{font-size:clamp(17px,6.2vw,28px)} .sigil{width:38px} }

if(typeof window.srcFor!=='function') window.srcFor=function(p){return p||'';};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(m){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];});}

function render(){
 var S=SITE;
 /* Loading a saved working copy replaces SITE.work with a different array, and WORK
    was still pointing at the one it replaced - so the cards drew from stale data
    while the editor and the bake used the new. Re-tie them on every draw. */
 WORK=SITE.work;

 document.getElementById('hdr').innerHTML=
  '<div class="who">'+
   '<div class="namerow"><h1 class="name">'+esc(S.name)+'</h1>'+
    (S.sigil?'<img class="sigil" src="'+esc(srcFor(S.sigil))+'" alt="">':'')+'</div>'+
   '<div class="lane">'+esc(S.lane)+'</div>'+
   '<div class="hsrow">'+
    (S.headshot?'<img class="hs" src="'+esc(srcFor(S.headshot))+'" alt="'+esc(S.name)+'">':'')+
    ((S.stills&&S.stills.length)?'<div class="stills">'+S.stills.map(function(x){
       return '<img src="'+esc(srcFor(x))+'" alt="" loading="lazy">'; }).join('')+'</div>':'')+
   '</div></div>'+
  '<div class="facts">'+(S.facts||[]).map(function(f){
    var val=String(f[1]||''), v;
    /* A web address is shown by where it goes, not by its full path - nobody needs to
       read a name id. An email is a mailto. Anything else is just text. */
    if(/^https?:\/\//i.test(val)){
     var label=val.replace(/^https?:\/\//i,'').replace(/^www\./i,'').replace(/\/$/,'');
     if(/imdb\.com\/name\//i.test(val)) label='imdb.com';
     v='<a href="'+esc(val)+'" target="_blank" rel="noopener">'+esc(label)+'</a>';
    } else if(/@/.test(val)){
     v='<a href="mailto:'+esc(val)+'">'+esc(val)+'</a>';
    } else v=esc(val);
    return '<span class="k">'+esc(f[0])+'</span>'+v; }).join('')+'</div>';

 if(S.reel){
  var v=document.getElementById('reelVid');
  v.src=srcFor(S.reel); if(S.reelPoster)v.poster=srcFor(S.reelPoster);
  document.getElementById('reelWell').style.display='';
  document.getElementById('reelSoon').style.display='none';
 }

 document.getElementById('ctWork').textContent='';
 document.getElementById('wall').innerHTML=WORK.map(function(w,i){
  return '<button class="pcard" onclick="openCredit('+i+')" aria-label="'+esc(w.t)+'">'+
   '<div class="part">'+(w.p?'<img src="'+esc(srcFor(/^(media\/|idb:)/.test(w.p)?w.p:'media/'+w.p))+'" alt="'+esc(w.t)+'" loading="lazy">':'')+
   (w.clip?'<span class="playdot">&#9654;</span>':'')+'</div>'+
   '<div class="pmeta"><b>'+esc(w.t)+'</b>'+
    '<span class="pch">'+esc(w.ch||'')+'</span>'+
    '<span class="pbits">'+esc([w.r,w.n].filter(Boolean).join(' \u00b7 '))+'</span></div></button>';
 }).join('');

 var F=S.films||[];
 document.getElementById('secFilms').style.display=F.length?'':'none';
 document.getElementById('ctFilms').textContent='';
 document.getElementById('films').innerHTML=F.map(function(f){
  return '<a class="film" href="'+esc(f.u)+'" target="_blank" rel="noopener">'+
   (f.p?'<span class="fart"><img src="'+esc(srcFor(f.p))+'" alt="'+esc(f.t)+'" loading="lazy"></span>':'')+
   '<span class="fbody"><b>'+esc(f.t)+'</b>'+
   (f.s?'<span>'+esc(f.s)+'</span>':'')+'<em>Watch on YouTube</em></span></a>'; }).join('');

 var W=S.writing||[];
 document.getElementById('ctWriting').textContent='';
 /* Six projects in a four-wide grid leaves two dead cells with the background
    showing through. The column count follows the number of posters: the widest
    arrangement that divides evenly and still leaves each poster a usable size. */
 var pc=(function(n){
  for(var c=5;c>=2;c--){ if(n%c===0) return c; }
  return Math.min(n,4);
 })(W.length);
 document.getElementById('writing').innerHTML=W.length
  ? '<div class="projects" style="--pcols:'+pc+'">'+W.map(function(x,i){
      /* The poster carries the title. Repeating it underneath was the page saying
         the same thing twice in two type sizes. Where there is no artwork yet the
         title still has to appear, or the card is blank. */
      return '<button class="proj" onclick="openProject('+i+')" aria-label="'+esc(x.t)+'">'+
        (x.p?'<span class="part2"'+(x.bg?' style="background:'+esc(x.bg)+'"':'')+
             '><img src="'+esc(srcFor(x.p))+'" alt="'+esc(x.t)+'" loading="lazy"></span>'
            :'<span class="noart"><b>'+esc(x.t)+'</b></span>')+
      '</button>'; }).join('')+'</div>'
  : '<p class="soon">Projects coming.</p>';

 var P=S.photos||[];
 document.getElementById('secPhotos').style.display=P.length?'':'none';
 document.getElementById('ctPhotos').textContent='';
 document.getElementById('photos').innerHTML=P.map(function(p){
  return '<img src="'+esc(srcFor(p))+'" alt="'+esc(S.name)+'" class="photo" loading="lazy">'; }).join('');

 var R=S.reps||[];
 document.getElementById('ftr').innerHTML=
  (R.length?'<div class="reps">'+R.map(function(r){
    var bits=[];
    if(r.who)   bits.push(esc(r.who));
    if(r.phone) bits.push('<a href="tel:'+esc(r.phone.replace(/[^+0-9]/g,''))+'">'+esc(r.phone)+'</a>');
    if(r.email) bits.push('<a href="mailto:'+esc(r.email)+'">'+esc(r.email)+'</a>');
    if(r.url)   bits.push('<a href="'+(/^https?:/.test(r.url)?esc(r.url):'https://'+esc(r.url))+'" target="_blank" rel="noopener">'+esc(r.url.replace(/^https?:\/\//,''))+'</a>');
    if(r.place) bits.push(esc(r.place));
    return '<div class="rep"><span class="rk">'+esc(r.label)+'</span>'+
      '<b>'+esc(r.name)+'</b>'+bits.map(function(x){return '<span>'+x+'</span>';}).join('')+'</div>';
  }).join('')+'</div>':'')+
  '<div class="fline">'+esc(S.footer||'')+
  (S.email?' &nbsp;&middot;&nbsp; <a href="mailto:'+esc(S.email)+'">'+esc(S.email)+'</a>':'')+'</div>';
}

   not open. Artwork, a logline, where it stands, what material there is. */

 /* Three columns: what it is on the left, the poster in the middle, the numbers on
    the right. The poster used to float in the middle of a wide black band with

function openCredit(i){

<script>
/* ===== TRIM + COMPRESS =====
   Replaces the third-party compressor step. Plays the source through a canvas at
   a chosen size and re-records it at a chosen bitrate, trimming as it goes.

   HONEST LIMITS, because they matter:
   - This is a real re-encode, not a container rewrite. It takes as long as the
     clip runs. A 90 second take takes 90 seconds.
   - Quality comes from the bitrate you pick, and the browser's encoder is not as
     good as a dedicated one. It is good enough for a self-tape and it is one step
     instead of another app.
   - Audio is carried through from the source track.
   - Nothing is upscaled. If you ask for a size larger than the source it clamps.

   Actors Access accepts up to 1 GB and asks for under 500 MB. The targets here are
   built around landing well under that without visible damage. */
(function(g){
const A={};

A.PRESETS=[
 {id:'CASTING', label:'Casting standard', h:1080, mbps:8,
  note:'1080p, high bitrate. What most offices expect.'},
 {id:'LIGHT',   label:'Smaller file',     h:1080, mbps:4,
  note:'1080p at half the bitrate. Uploads faster, still clean.'},
 {id:'SMALL',   label:'720p',             h:720,  mbps:2.5,
  note:'When the upload keeps failing or the connection is bad.'}
];
A.estimate=function(seconds,mbps){ return Math.round(seconds*mbps*1000000/8); };

A.mime=function(){
 for(const m of ['video/mp4;codecs=avc1.4d002a,mp4a.40.2','video/mp4;codecs=avc1','video/mp4',
                 'video/webm;codecs=vp9,opus','video/webm']){
  try{ if(MediaRecorder.isTypeSupported(m))return m; }catch(e){}
 }
 return '';
};

/* trimStart / trimEnd in seconds. h = target height. */
A.process=async function(blob,opts){
 const o=Object.assign({h:1080,mbps:8,trimStart:0,trimEnd:0,onProgress:null},opts||{});
 const v=document.createElement('video');
 v.src=URL.createObjectURL(blob); v.muted=false; v.playsInline=true; v.preload='auto';
 await new Promise((res,rej)=>{ v.onloadedmetadata=res; v.onerror=()=>rej(new Error('cannot read that take')); });
 const SW=v.videoWidth, SH=v.videoHeight, dur=v.duration;
 if(!SW||!isFinite(dur)) throw new Error('that take has no usable video');

 const start=Math.max(0,Math.min(o.trimStart,dur-0.2));
 const end=Math.max(start+0.2,Math.min(dur-(o.trimEnd||0),dur));
 const span=end-start;

 // never upscale
 const outH=Math.min(o.h,SH), outW=Math.round(SW*(outH/SH)/2)*2;
 const cvs=document.createElement('canvas'); cvs.width=outW; cvs.height=outH;
 const ctx=cvs.getContext('2d');
 const stream=cvs.captureStream(30);
 try{
  const sv=v.captureStream?v.captureStream():null;
  if(sv) sv.getAudioTracks().forEach(t=>stream.addTrack(t));
 }catch(e){}

 const m=A.mime();
 const rec = m ? new MediaRecorder(stream,{mimeType:m,
                   videoBitsPerSecond:Math.round(o.mbps*1000000), audioBitsPerSecond:128000})
               : new MediaRecorder(stream);
 const chunks=[];
 rec.ondataavailable=e=>{ if(e.data.size)chunks.push(e.data); };
 const done=new Promise(res=>{ rec.onstop=()=>res(new Blob(chunks,{type:rec.mimeType||'video/mp4'})); });

 v.currentTime=start;
 await new Promise(r=>{ const h2=()=>{v.removeEventListener('seeked',h2);r();}; v.addEventListener('seeked',h2); });
 rec.start();
 await v.play().catch(()=>{});
 await new Promise(resolve=>{
  const tick=()=>{
   if(v.currentTime>=end||v.ended){ resolve(); return; }
   ctx.drawImage(v,0,0,outW,outH);
   if(o.onProgress)o.onProgress(Math.min(1,(v.currentTime-start)/span));
   requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
 });
 try{ v.pause(); }catch(e){}
 rec.stop();
 const out=await done;
 URL.revokeObjectURL(v.src);
 return {blob:out, width:outW, height:outH, seconds:Math.round(span*10)/10,
         from:blob.size, to:out.size,
         saved:Math.round((1-out.size/Math.max(1,blob.size))*100)};
};
/* ===== STITCH =====
   Some offices want every take as its own file; some want one file with the slate
   on the front. This plays each clip through a canvas in sequence and records the
   whole run as a single video.

   It re-encodes in real time, so the cost is the sum of the clips - three ninety
   second takes plus a slate is about five minutes. There is no faster path in a
   browser without a native encoder.

   Hard cuts only. Casting instructions routinely say no cross-fades, so the join
   is either a straight cut or a beat of black, never a dissolve. */
A.stitch=async function(items,opts){
 const o=Object.assign({h:1080,mbps:8,gapMs:0,onProgress:null},opts||{});
 if(!items.length)throw new Error('nothing to join');
 // measure first so the canvas is sized once and never rescales mid-run
 const vids=[];
 for(const it of items){
  const v=document.createElement('video');
  v.src=URL.createObjectURL(it.blob); v.preload='auto'; v.playsInline=true;
  await new Promise((res,rej)=>{ v.onloadedmetadata=res; v.onerror=()=>rej(new Error('cannot read '+(it.name||'a clip'))); });
  vids.push({v:v,name:it.name});
 }
 const src=vids[0].v;
 const outH=Math.min(o.h,src.videoHeight||o.h);
 const outW=Math.round((src.videoWidth/src.videoHeight)*outH/2)*2;
 const cvs=document.createElement('canvas'); cvs.width=outW; cvs.height=outH;
 const ctx=cvs.getContext('2d');
 const stream=cvs.captureStream(30);

 // one audio destination the whole run mixes into, so the track never stops
 const AC=window.AudioContext||window.webkitAudioContext;
 const ac=new AC(); const dest=ac.createMediaStreamDestination();
 dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));

 const m=A.mime();
 const rec = m ? new MediaRecorder(stream,{mimeType:m,videoBitsPerSecond:Math.round(o.mbps*1000000),audioBitsPerSecond:128000})
               : new MediaRecorder(stream);
 const chunks=[]; rec.ondataavailable=e=>{ if(e.data.size)chunks.push(e.data); };
 const done=new Promise(res=>{ rec.onstop=()=>res(new Blob(chunks,{type:rec.mimeType||'video/mp4'})); });
 rec.start();

 const total=vids.reduce((n,x)=>n+(isFinite(x.v.duration)?x.v.duration:0),0)||1;
 let elapsed=0;
 for(let i=0;i<vids.length;i++){
  const v=vids[i].v;
  let node=null;
  try{ node=ac.createMediaElementSource(v); node.connect(dest); }catch(e){}
  v.currentTime=0;
  await new Promise(r=>{ const h=()=>{v.removeEventListener('seeked',h);r();}; v.addEventListener('seeked',h); });
  await v.play().catch(()=>{});
  await new Promise(resolve=>{
   const tick=()=>{
    if(v.ended||v.currentTime>=(v.duration-0.05)){ resolve(); return; }
    ctx.drawImage(v,0,0,outW,outH);
    if(o.onProgress)o.onProgress(Math.min(1,(elapsed+v.currentTime)/total), vids[i].name);
    requestAnimationFrame(tick);
   };
   requestAnimationFrame(tick);
  });
  try{ v.pause(); }catch(e){}
  elapsed+=isFinite(v.duration)?v.duration:0;
  try{ if(node)node.disconnect(); }catch(e){}
  // a beat of black between clips, never a dissolve
  if(o.gapMs && i<vids.length-1){
   const t0=performance.now();
   await new Promise(resolve=>{
    const tick=()=>{
     if(performance.now()-t0>=o.gapMs){ resolve(); return; }
     ctx.fillStyle='#000'; ctx.fillRect(0,0,outW,outH);
     requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
   });
  }
 }
 rec.stop();
 const out=await done;
 vids.forEach(x=>{ try{URL.revokeObjectURL(x.v.src);}catch(e){} });
 try{ ac.close(); }catch(e){}
 return {blob:out,width:outW,height:outH,seconds:Math.round(total*10)/10,count:items.length};
};
g.ActorCompress=A;
})(window);

</script>

  var med=function(a){ a.sort(function(p,q){return p-q}); return a[Math.floor(a.length/2)]||0; };
  var hex=function(n){ return ('0'+Math.max(0,Math.min(255,n)).toString(16)).slice(-2); };
  return '#'+hex(med(R))+hex(med(G))+hex(med(B));
 }catch(e){ return ''; }
}
async function addImage(file){
 var max=2200;
 var img=await new Promise(function(res,rej){ var im=new Image();
  im.onload=function(){res(im)}; im.onerror=function(){rej(new Error('cannot read that image'))};
  im.src=URL.createObjectURL(file); });
 var blob=file, name=file.name;
 if(Math.max(img.width,img.height)>max || file.size>1.6*MB){
  var sc=Math.min(1,max/Math.max(img.width,img.height));
  var c=document.createElement('canvas');
  c.width=Math.round(img.width*sc)||img.width; c.height=Math.round(img.height*sc)||img.height;
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  blob=await new Promise(function(r){ c.toBlob(r,'image/jpeg',0.86); });
  name=name.replace(/\.[^.]+$/,'')+'.jpg';
 }
 var id=newId(); MEDIA[id]={id:id,blob:blob,name:name};
 await DB.putMedia(id,blob,name);
 return 'idb:'+id;
}
async function addVideo(file,label,isReel){
 var cap=isReel?60*MB:22*MB, blob=file, name=file.name;
 if(file.size>cap){
  if(typeof ActorCompress!=='object'){ throw new Error('the re-encoder is missing from this page'); }
  busy(true,'Shrinking '+label,'runs in real time',0);
  var res=await ActorCompress.process(file,{h:isReel?1080:720,mbps:isReel?4:1.8,
   onProgress:function(p){ busy(true,'Shrinking '+label,Math.round((p||0)*100)+'%',p); }});
  busy(false);
  blob=(res&&res.blob)?res.blob:res;
  if(!(blob instanceof Blob)) throw new Error('the re-encoder returned nothing usable');
  name=name.replace(/\.[^.]+$/,'')+'.mp4';
 } else {
  var ext=(name.split('.').pop()||'mp4').toLowerCase();
  if(ext==='mov'||ext==='m4v') name=name.replace(/\.[^.]+$/,'')+'.mp4';
 }
 var id=newId(); MEDIA[id]={id:id,blob:blob,name:name};
 await DB.putMedia(id,blob,name);
 return 'idb:'+id;
}

/* ---------- baking ----------
   Everything added here is held as idb:<id>. Baking gives each one a real filename,
   rewrites the page to point at it, and hands back a folder to upload. Nothing is
   thrown away: the working copy stays in this browser, so a bake can be repeated. */
function crc32(b){ var c,t=crc32.t;
 if(!t){t=crc32.t=[];for(var n=0;n<256;n++){c=n;for(var k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}}
 var crc=0xFFFFFFFF; for(var i=0;i<b.length;i++)crc=(crc>>>8)^t[(crc^b[i])&255];
 return (crc^0xFFFFFFFF)>>>0; }
function zipOf(files){
 var enc=new TextEncoder(),chunks=[],cen=[],off=0;
 var u16=function(v){return [v&255,(v>>8)&255]}, u32=function(v){return [v&255,(v>>8)&255,(v>>16)&255,(v>>24)&255]};
 files.forEach(function(f){ var nm=enc.encode(f.name),d=f.data,crc=crc32(d);
  var L=[].concat(u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),
    u32(d.length),u32(d.length),u16(nm.length),u16(0));
  chunks.push(new Uint8Array(L),nm,d); cen.push({nm:nm,crc:crc,size:d.length,off:off});
  off+=L.length+nm.length+d.length; });
 var cs=off,cl=0;
 cen.forEach(function(c){ var H=[].concat(u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),
   u32(c.crc),u32(c.size),u32(c.size),u16(c.nm.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(c.off));
  chunks.push(new Uint8Array(H),c.nm); cl+=H.length+c.nm.length; });
 chunks.push(new Uint8Array([].concat(u32(0x06054b50),u16(0),u16(0),u16(cen.length),
   u16(cen.length),u32(cl),u32(cs),u16(0))));
 return new Blob(chunks,{type:'application/zip'});
}
function slugFile(base,ext){
 return String(base||'file').toLowerCase().replace(/\.[^.]+$/,'')
  .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,46)+'.'+ext;
}
async function bake(){
 busy(true,'Baking','working out what is new',0);
 var out=JSON.parse(JSON.stringify(SITE)), files=[], used={}, map={};
 var ids=[];
 /* Every path already on the site is spoken for. Without this a new still called
    still-car.jpg would be handed the same filename as the still-car.jpg already
    published, and the upload would quietly replace the wrong picture. */
 (function seed(o){
  if(Array.isArray(o)) return o.forEach(seed);
  if(o&&typeof o==='object'){ for(var k in o) seed(o[k]); return; }
  if(typeof o==='string'&&o.indexOf('media/')===0) used[o]=1;
 })(out);
 var walk=function(o){
  if(Array.isArray(o)) return o.map(walk);
  if(o&&typeof o==='object'){ var r={}; for(var k in o) r[k]=walk(o[k]); return r; }
  if(typeof o==='string'&&o.indexOf('idb:')===0){ if(ids.indexOf(o)<0)ids.push(o); return o; }
  return o;
 };
 walk(out);
 for(var i=0;i<ids.length;i++){
  var key=ids[i], rec=MEDIA[key.slice(4)];
  if(!rec) continue;
  var ext=(rec.name.split('.').pop()||'bin').toLowerCase();
  var name='media/'+slugFile(rec.name,ext);
  var stem=slugFile(rec.name,ext).replace(/\.[^.]+$/,'');
  var n=2; while(used[name]){ name='media/'+stem+'-'+(n++)+'.'+ext; }
  used[name]=1; map[key]=name;
  busy(true,'Baking',rec.name,(i+1)/(ids.length+1));
  files.push({name:name,data:new Uint8Array(await rec.blob.arrayBuffer())});
 }
 var swap=function(o){
  if(Array.isArray(o)) return o.map(swap);
  if(o&&typeof o==='object'){ var r={}; for(var k in o) r[k]=swap(o[k]); return r; }
  if(typeof o==='string'&&map[o]) return map[o];
  return o;
 };
 out=swap(out);
 var doc=document.documentElement.outerHTML;
 /* Rewrite the page's own SITE block. The edit layer stays in the file - it is inert
    without #edit on the address, and it is what makes the next round of changes
    possible without starting over. */
 var baked=doc.replace(/const SITE=\{[\s\S]*?\n\};/,'const SITE='+JSON.stringify(out,null,1)+';');
 if(baked===doc){ busy(false); alert('Could not rewrite the page. Nothing was baked.'); return; }
 files.unshift({name:'index.html',data:new TextEncoder().encode('<!doctype html>\n'+baked)});
 files.push({name:'UPLOAD-THESE.txt',data:new TextEncoder().encode(
  'Drag everything in here into your GitHub repo and commit.\n\n'+
  'index.html sits at the top level, everything in media/ goes in media/.\n'+
  'Say yes when it asks to overwrite index.html.\n\n'+
  'Your working copy stays in this browser, so you can keep editing and bake again.\n')});
