let WORK=SITE.work;

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(m){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];});}

function render(){
 var S=SITE;
 document.getElementById('hdr').innerHTML=
  '<div class="who"><h1 class="name">'+esc(S.name)+'</h1><div class="lane">'+esc(S.lane)+'</div>'+
  (S.headshot?'<img class="hs" src="'+esc(S.headshot)+'" alt="'+esc(S.name)+'">':'')+'</div>'+
  '<div class="facts">'+(S.facts||[]).map(function(f){
    var v=/@/.test(f[1])?'<a href="mailto:'+esc(f[1])+'">'+esc(f[1])+'</a>':esc(f[1]);
    return '<span class="k">'+esc(f[0])+'</span>'+v; }).join('')+'</div>';

 if(S.reel){
  var v=document.getElementById('reelVid');
  v.src=S.reel; if(S.reelPoster)v.poster=S.reelPoster;
  document.getElementById('reelWell').style.display='';
  document.getElementById('reelSoon').style.display='none';
 }

 document.getElementById('ctWork').textContent=WORK.length||'';
 document.getElementById('wall').innerHTML=WORK.map(function(w,i){
  return '<button class="pcard" onclick="openCredit('+i+')" aria-label="'+esc(w.t)+'">'+
   '<div class="part">'+(w.p?'<img src="'+esc(/^media\//.test(w.p)?w.p:'media/'+w.p)+'" alt="'+esc(w.t)+'" loading="lazy">':'')+
   (w.clip?'<span class="playdot">&#9654;</span>':'')+'</div>'+
   '<div class="pmeta"><b>'+esc(w.t)+'</b>'+
    '<span class="pch">'+esc(w.ch||'')+'</span>'+
    '<span class="pbits">'+esc([w.r,w.n].filter(Boolean).join(' \u00b7 '))+'</span></div></button>';
 }).join('');

 var F=S.films||[];
 document.getElementById('secFilms').style.display=F.length?'':'none';
 document.getElementById('ctFilms').textContent=F.length||'';
 document.getElementById('films').innerHTML=F.map(function(f){
  return '<a class="film" href="'+esc(f.u)+'" target="_blank" rel="noopener"><b>'+esc(f.t)+'</b>'+
   (f.s?'<span>'+esc(f.s)+'</span>':'')+'<em>Watch on YouTube</em></a>'; }).join('');

 var W=S.writing||[];
 document.getElementById('ctWriting').textContent=W.length||'';
 document.getElementById('writing').innerHTML=W.length
  ? '<div class="films">'+W.map(function(x){
      return '<a class="film" href="'+esc(x.u||'#')+'"'+(x.u?' target="_blank" rel="noopener"':' onclick="return false"')+
      '><b>'+esc(x.t)+'</b>'+(x.s?'<span>'+esc(x.s)+'</span>':'')+'</a>'; }).join('')+'</div>'
  : '<p class="soon">Projects coming.</p>';

 var P=S.photos||[];
 document.getElementById('secPhotos').style.display=P.length?'':'none';
 document.getElementById('ctPhotos').textContent=P.length||'';
 document.getElementById('photos').innerHTML=P.map(function(p){
  return '<img src="'+esc(p)+'" alt="'+esc(S.name)+'" style="width:100%;display:block" loading="lazy">'; }).join('');

 document.getElementById('ftr').innerHTML=esc(S.footer||'')+
  (S.email?' &nbsp;&middot;&nbsp; <a href="mailto:'+esc(S.email)+'" style="color:var(--blue)">'+esc(S.email)+'</a>':'');
}
render();

function openCredit(i){
 const c=WORK[i]; if(!c)return;
 document.getElementById('vch').textContent=c.ch||'';
 document.getElementById('vt').textContent=c.t||'';
 document.getElementById('vs').textContent=[c.r,c.n,c.d?'dir. '+c.d:''].filter(Boolean).join(' \u00b7 ');
 document.getElementById('vbody').innerHTML = c.clip
   ? '<video src="'+c.clip+'" controls autoplay playsinline></video>'
   : (c.p ? '<img src="'+(/^media\//.test(c.p)?c.p:'media/'+c.p)+'" alt="">'
          + '<div class="vnone">No clip on file for this one yet.</div>' : '');
 /* Optional context on the credit - what the scene was, who was in it, anything
    worth knowing. Absent on most, and absent means nothing is drawn. */
 var nt=document.getElementById('vnote');
 nt.textContent=c.note||'';
 nt.style.display=c.note?'':'none';
 document.getElementById('viewer').classList.add('on');
 document.body.style.overflow='hidden';
}
function closeCredit(){
 const v=document.getElementById('viewer');
 v.classList.remove('on');
 document.getElementById('vbody').innerHTML='';
 document.body.style.overflow='';
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape')closeCredit(); });
